<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Triply</title>
    <script>
      // GitHub Pages SPA redirect trick:
      // Cuando Pages devuelve 404 en una ruta de la SPA,
      // redirigimos al index.html preservando la ruta como query param.
      var pathSegmentsToKeep = 1; // número de segmentos del base-href (/triply/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
