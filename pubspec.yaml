name: triply
description: "Triply - El sistema operativo del viaje grupal. Planificación, organización y memoria colaborativa con IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Navegación y Gestión de Estado
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend, Autenticación y Base de Datos
  supabase_flutter: ^2.6.0
  shared_preferences: ^2.2.3

  # UI, Iconos, Fuentes y Animaciones
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
